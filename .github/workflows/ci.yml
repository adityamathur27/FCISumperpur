name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build & Test Pre-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Verify Production Build
        run: |
          npm run build

      - name: Run Test Suite
        run: |
          npm test -- --watchAll=false --passWithNoTests

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test
    # Deploy only on pushes/merges to main or dev branch after pre-checks pass successfully
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Information
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_ix3FhhPmSugrmz2dkD80PCou
          VERCEL_PROJECT_ID: prj_tVEDeEUSrm4AlPSdG8ZdzGBfxsBI

      - name: Build Project Artifacts
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_ix3FhhPmSugrmz2dkD80PCou
          VERCEL_PROJECT_ID: prj_tVEDeEUSrm4AlPSdG8ZdzGBfxsBI

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_ix3FhhPmSugrmz2dkD80PCou
          VERCEL_PROJECT_ID: prj_tVEDeEUSrm4AlPSdG8ZdzGBfxsBI
